<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>lemma</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Effect yields between a fiber's steps with `setImmediate` where there is one, and with `setTimeout(0)`
      // elsewhere, which a browser delays to 4ms once nested and to a second or more in a hidden tab: the app took
      // three times as long to start. A message to a channel runs as soon as the page is free. Effect looks for
      // `setImmediate` when its module loads, which may be in any of the app's chunks, so this runs before them all.
      if (!("setImmediate" in globalThis)) {
        const tasks = new Map();
        let next = 0;
        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => {
          const task = tasks.get(event.data);
          tasks.delete(event.data);
          task?.();
        };
        Object.assign(globalThis, {
          setImmediate: (task) => {
            const id = next++;
            tasks.set(id, task);
            channel.port2.postMessage(id);
            return id;
          },
          clearImmediate: (id) => void tasks.delete(id),
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
