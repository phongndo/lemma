[project]
name = "lemma"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "ty==0.0.67",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.ty.src]
include = ["bench", "benchmarks", "scripts", "test", "tests", "tools"]
