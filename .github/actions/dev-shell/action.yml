name: Dev shell
description: >-
  Install Nix and the workspace's dependencies in the development shell (flake.nix), restoring the pnpm store from
  the cache. Runs after actions/checkout; later steps run in the shell with `nix develop -c`.

inputs:
  shell:
    description: >-
      The flake's dev shell the job's later steps use. One other than `default` (`browser`) is fetched in the
      background meanwhile, so it is there, or nearly, when they start.
    default: default

# Actions are pinned by commit, their version in the comment.
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        # A download that stalls is given up after 30 s, not the default 300 (most of a job's timeout), and tried again.
        extra_nix_config: |
          stalled-download-timeout = 30
    # The shell comes from cache.nixos.org, which now and then drops a download; tried three times, it fails the job
    # only when the cache stays down. The other shell is fetched meanwhile; its first use fetches it again if that
    # failed.
    - id: pnpm-store
      shell: bash
      env:
        DEV_SHELL: ${{ inputs.shell }}
      run: |
        if [ "$DEV_SHELL" != default ]; then nix develop ".#$DEV_SHELL" -c true > /dev/null 2>&1 & fi
        for attempt in 1 2 3; do
          nix develop -c true && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          echo "::warning title=Dev shell::Fetching the development shell failed (try $attempt of 3); trying again"
          sleep $((attempt * 15))
        done
        path=$(nix develop -c pnpm store path)
        echo "path=$path" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - shell: bash
      run: nix develop -c pnpm install --frozen-lockfile
