name: Stress

# By hand: `pnpm stress` on a Linux or macOS runner, to show a flake that a fast machine does not, and then that a fix
# holds (docs/development.md).
on:
  workflow_dispatch:
    inputs:
      target:
        description: A test file or a package directory, as `pnpm stress` takes it
        required: true
      name:
        description: Only the tests whose names match this (vitest's -t)
        default: ""
      runs:
        description: How many runs
        default: "30"
      jobs:
        description: How many at once
        default: "4"
      os:
        description: The runner, as Check runs on it
        type: choice
        options: [linux, macos]
        default: linux

permissions:
  contents: read

# Actions are pinned by commit, their version in the comment.
jobs:
  stress:
    name: stress (${{ inputs.os }})
    runs-on: ${{ inputs.os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      TARGET: ${{ inputs.target }}
      NAME: ${{ inputs.name }}
      RUNS: ${{ inputs.runs }}
      JOBS: ${{ inputs.jobs }}
      LEMMA_TEST_ARTIFACTS: /tmp/lemma-test-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux in the development shell, macOS with plain Node.js and pnpm: as Check's tests run on each.
      - if: inputs.os == 'linux'
        uses: ./.github/actions/dev-shell
      - if: inputs.os == 'linux'
        run: nix develop -c pnpm build && nix develop -c pnpm stress "$TARGET" --runs "$RUNS" --jobs "$JOBS" ${NAME:+--name "$NAME"}
      - if: inputs.os == 'macos'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: inputs.os == 'macos'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: inputs.os == 'macos'
        run: pnpm install --frozen-lockfile && pnpm build && pnpm stress "$TARGET" --runs "$RUNS" --jobs "$JOBS" ${NAME:+--name "$NAME"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: stress-evidence
          path: /tmp/lemma-test-evidence
          if-no-files-found: ignore
