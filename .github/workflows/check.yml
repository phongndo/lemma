name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, every job: main reruns unchanged, so a failure there is a flake to fix (docs/development.md), and the
  # nightly job runs its long seeded tests.
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit, their version in the comment.
# What each job runs is a script in package.json (`pnpm run ci` is the check and test jobs), so it runs the same
# locally. The jobs run in parallel, each on its own runner; on Linux in the Nix development shell as developers use
# it (.github/actions/dev-shell).
jobs:
  # Build, import boundaries, test hygiene, lint, format check, type-check; then the packed packages, in Node.js and in
  # Chromium, which the browser shell fetched meanwhile. One job, as they take a minute between them: a runner of
  # their own would spend half its time setting up.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
        with:
          shell: browser
      - run: nix develop -c pnpm check
      - run: nix develop -c pnpm package:check
      - run: nix develop .#browser -c pnpm browser:check
        env:
          LEMMA_BENCH_OUTPUT_DIR: ${{ runner.temp }}/metrics
      # Each commit on main leaves its numbers (bundle size, microbenchmarks, the session log's appends), so a
      # trend can be read back: `gh run download --name metrics-<sha>`. Timings on shared runners are noisy; compare
      # two builds with the bench workflow instead.
      - if: github.event_name == 'push'
        run: nix develop -c pnpm perf:check
        env:
          LEMMA_BENCH_OUTPUT_DIR: ${{ runner.temp }}/metrics
          LEMMA_PERF_ENFORCE: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: metrics-${{ github.sha }}
          path: ${{ runner.temp }}/metrics
          retention-days: 90

  # The tests keep a runner's cores busy, so they run in shards on a runner each, split by how long each file takes
  # (scripts/test-shards.ts).
  test:
    name: test (Linux, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LEMMA_TEST_ARTIFACTS: /tmp/lemma-test-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
      - run: nix develop -c pnpm test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-evidence-linux-${{ matrix.shard }}
          path: /tmp/lemma-test-evidence
          if-no-files-found: ignore

  # The tests again on macOS, with plain Node.js and pnpm; what the check job checks is the same on every platform.
  # The host does not support Windows yet. No pnpm store cache: on macOS, restoring it took longer than installing.
  # In thirds: a macOS runner has fewer cores than a Linux one. On main and daily, not on pull requests: GitHub runs
  # five macOS jobs at once on a free plan, so two pull requests' runs queued for them, often for minutes. A pull
  # request pushed from a Mac ran them in the pre-push hook (`pnpm run ci`); `gh workflow run check.yml --ref <branch>`
  # runs them on one.
  macos:
    name: test (macOS, ${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      LEMMA_TEST_ARTIFACTS: /tmp/lemma-test-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-evidence-macos-${{ matrix.shard }}
          path: /tmp/lemma-test-evidence
          if-no-files-found: ignore

  # The release archive for Linux on x64, installed and run outside the checkout (scripts/dist-check.ts), and the desktop
  # app made from it, installed and opened as a user would (scripts/dist-desktop-check.ts), as the Nightly workflow's
  # verify does, so a change that breaks a release fails here rather than in the nightly; they are kept a week, to try
  # a change with.
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
        with:
          shell: desktop
      - run: nix develop -c pnpm dist
      - run: nix develop -c pnpm dist:check
      - run: nix develop .#desktop -c pnpm dist:desktop
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fuse3 ./dist/lemma-desktop-*.deb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - run: nix develop .#desktop -c xvfb-run -a pnpm dist:desktop:check --installed dist/lemma-desktop-*.deb
      - run: nix develop .#desktop -c xvfb-run -a pnpm dist:desktop:check dist/lemma-desktop-*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemma-linux-x64
          path: dist/
          retention-days: 7

  # The web app's replaceability, checked on its real composition in Chromium (apps/web/AGENTS.md); in two shares, as
  # its lanes keep a runner's cores busy.
  ui:
    name: ui (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
        with:
          shell: browser
      - run: nix develop .#browser -c pnpm --filter @lemma/web-app ui:check --shard=${{ matrix.shard }}/2
        env:
          LEMMA_UI_ARTIFACTS: ${{ runner.temp }}/ui-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-check-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-check
          if-no-files-found: ignore

  # The one check a branch rule needs to require: it passes only when every job above passed, so jobs can be added,
  # split, or renamed without changing the rule. A skipped required job would count as passing; this one never skips.
  # The one skip it accepts is macOS's on a pull request, which it skips by design.
  passed:
    if: always()
    needs: [check, test, macos, dist, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          failed=$(jq -r --arg event "$EVENT" 'to_entries[]
            | select(.value.result != "success" and (.key != "macos" or $event != "pull_request" or .value.result != "skipped"))
            | "\(.key) \(.value.result)"' <<< "$NEEDS" | paste -sd, -)
          if [ -n "$failed" ]; then echo "::error::Not every job passed: $failed" && exit 1; fi

  # Nightly (or by hand): the tests with a fresh seed and many more property-test cases, and the performance checks.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Each run new seeds; a re-run keeps them. The kernel's property test allows 60 s, which bounds its cases.
      LEMMA_SEQUENCE_SEED: ${{ github.run_number }}
      LEMMA_SEQUENCE_RUNS: "3000"
      # The session log's simulation (crashes, torn writes, failing disks) and the agent's conversations.
      LEMMA_SIM_SEED: ${{ github.run_number }}
      LEMMA_SIM_RUNS: "20000"
      LEMMA_CONVERSATION_SEED: ${{ github.run_number }}
      LEMMA_CONVERSATION_RUNS: "500"
      # The harness simulation (packages/sim): a window of seeds no earlier night ran, at the runner's full length.
      LEMMA_HARNESS_SEED: ${{ github.run_number }}00000
      LEMMA_HARNESS_RUNS: "2000"
      LEMMA_HARNESS_TICKS: "200"
      # The harness from the outside (scripts/torture.ts): a real host killed and stopped under a seeded workload.
      LEMMA_TORTURE_SEED: ${{ github.run_number }}
      LEMMA_TORTURE_SECONDS: "180"
      LEMMA_BENCH_OUTPUT_DIR: /tmp/lemma-performance
      LEMMA_TEST_ARTIFACTS: /tmp/lemma-test-evidence
      # Shared runner timings are advisory; correctness/resource assertions fail.
      LEMMA_PERF_ENFORCE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
      # The randomized tests (the core's, the session log's simulation, the agent's conversations, the harness
      # simulation), many more of them;
      # every test runs in the jobs above.
      - run: nix develop -c pnpm test:random
      - run: nix develop -c pnpm torture
      - run: nix develop -c pnpm test:mutations
      - run: nix develop -c pnpm perf:check
      - if: failure()
        run: >-
          echo "::error title=Reproduce::git checkout $GITHUB_SHA &&
          LEMMA_SEQUENCE_SEED=$LEMMA_SEQUENCE_SEED LEMMA_SEQUENCE_RUNS=$LEMMA_SEQUENCE_RUNS
          LEMMA_SIM_SEED=$LEMMA_SIM_SEED LEMMA_SIM_RUNS=$LEMMA_SIM_RUNS
          LEMMA_CONVERSATION_SEED=$LEMMA_CONVERSATION_SEED LEMMA_CONVERSATION_RUNS=$LEMMA_CONVERSATION_RUNS
          LEMMA_HARNESS_SEED=$LEMMA_HARNESS_SEED LEMMA_HARNESS_RUNS=$LEMMA_HARNESS_RUNS LEMMA_HARNESS_TICKS=$LEMMA_HARNESS_TICKS
          nix develop -c pnpm test:random (a failing property also prints its replay path; a failing simulation seed, its pnpm sim command);
          the torture test's workload: LEMMA_TORTURE_SEED=$LEMMA_TORTURE_SEED LEMMA_TORTURE_SECONDS=$LEMMA_TORTURE_SECONDS nix develop -c pnpm torture"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance
          path: /tmp/lemma-performance
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: nightly-test-evidence
          path: /tmp/lemma-test-evidence
          if-no-files-found: ignore
