name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, every job: main reruns unchanged, so a flake shows (docs/development.md). The long seeded checks are the
  # Soak workflow's.
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit, their version in the comment.
# What each job runs is a script in package.json (`pnpm run ci` is the check and test jobs), so it runs the same
# locally. The jobs run in parallel, each on its own runner; on Linux in the Nix development shell as developers use
# it (.github/actions/dev-shell).
# A failed test or UI check lane is tried again, and one that passes on a retry is recorded as flaky
# (`LEMMA_FLAKY_OUTPUT`, scripts/flaky.ts): docs/development.md says why and what becomes of it.
jobs:
  # Build, import boundaries, test hygiene, lint, format check, type-check; then the packed packages, in Node.js and in
  # Chromium, which the browser shell fetched meanwhile. One job, as they take a minute between them: a runner of
  # their own would spend half its time setting up.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
        with:
          shell: browser
      - run: nix develop -c pnpm check
      - run: nix develop -c pnpm package:check
      - run: nix develop .#browser -c pnpm browser:check

  # The tests keep a runner's cores busy, so they run in shards on a runner each, split by how long each file takes
  # (scripts/test-shards.ts). In the browser shell, so the Chromium tests drive the pinned Chromium: in the default
  # shell they find the runner image's own, a Chromium snapshot that changes with each image.
  test:
    name: test (Linux, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEMMA_TEST_ARTIFACTS: /tmp/lemma-test-evidence
      LEMMA_FLAKY_OUTPUT: /tmp/lemma-flaky.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
        with:
          shell: browser
      # A second after a failure, while what slowed the runner passes, twice at most.
      - run: nix develop .#browser -c pnpm test --shard=${{ matrix.shard }}/2 --retry.count=2 --retry.delay=1000
      # Evidence a failed try saved, kept also when a retry passed: what fixing the flake needs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-evidence-linux-${{ matrix.shard }}
          path: /tmp/lemma-test-evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-linux-${{ matrix.shard }}
          path: /tmp/lemma-flaky.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # The tests again on macOS, with plain Node.js and pnpm; what the check job checks is the same on every platform.
  # The host does not support Windows yet. No pnpm store cache: on macOS, restoring it took longer than installing.
  # In thirds: a macOS runner has fewer cores than a Linux one. On main and daily, not on pull requests: GitHub runs
  # five macOS jobs at once on a free plan, so two pull requests' runs queued for them, often for minutes. A pull
  # request pushed from a Mac ran them in the pre-push hook (`pnpm run ci`); `gh workflow run check.yml --ref <branch>`
  # runs them on one.
  macos:
    name: test (macOS, ${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      LEMMA_TEST_ARTIFACTS: /tmp/lemma-test-evidence
      LEMMA_FLAKY_OUTPUT: /tmp/lemma-flaky.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/3 --retry.count=2 --retry.delay=1000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-evidence-macos-${{ matrix.shard }}
          path: /tmp/lemma-test-evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-macos-${{ matrix.shard }}
          path: /tmp/lemma-flaky.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # The release archive for Linux on x64, installed and run outside the checkout (scripts/dist-check.ts), and the desktop
  # app made from it, installed and opened as a user would (scripts/dist-desktop-check.ts), as the Nightly workflow's
  # verify does, so a change that breaks a release fails here rather than in the nightly; they are kept a week, to try
  # a change with.
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
        with:
          shell: desktop
      - run: nix develop -c pnpm dist
      - run: nix develop -c pnpm dist:check
      - run: nix develop .#desktop -c pnpm dist:desktop
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fuse3 ./dist/lemma-desktop-*.deb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - run: nix develop .#desktop -c xvfb-run -a pnpm dist:desktop:check --installed dist/lemma-desktop-*.deb
      - run: nix develop .#desktop -c xvfb-run -a pnpm dist:desktop:check dist/lemma-desktop-*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemma-linux-x64
          path: dist/
          retention-days: 7

  # The web app's replaceability, checked on its real composition in Chromium (apps/web/AGENTS.md); in two shares, as
  # its lanes keep a runner's cores busy. A lane that fails runs once more; the traces of each failed try are kept.
  ui:
    name: ui (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEMMA_FLAKY_OUTPUT: /tmp/lemma-flaky.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-shell
        with:
          shell: browser
      - run: nix develop .#browser -c pnpm --filter @lemma/web-app ui:check --shard=${{ matrix.shard }}/2 --retry=1
        env:
          LEMMA_UI_ARTIFACTS: ${{ runner.temp }}/ui-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-check-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-check
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-ui-${{ matrix.shard }}
          path: /tmp/lemma-flaky.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # The one check a branch rule needs to require: it passes only when every job above passed, so jobs can be added,
  # split, or renamed without changing the rule. A skipped required job would count as passing; this one never skips.
  # The one skip it accepts is macOS's on a pull request, which it skips by design.
  passed:
    if: always()
    needs: [check, test, macos, dist, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          failed=$(jq -r --arg event "$EVENT" 'to_entries[]
            | select(.value.result != "success" and (.key != "macos" or $event != "pull_request" or .value.result != "skipped"))
            | "\(.key) \(.value.result)"' <<< "$NEEDS" | paste -sd, -)
          if [ -n "$failed" ]; then echo "::error::Not every job passed: $failed" && exit 1; fi

  # On main: files each check that passed only on a retry (above) as an issue (scripts/file-issue.ts). Filing says
  # nothing about the change, so it is not one of `passed`'s, and failing to file leaves the run passed: the Nightly
  # workflow releases only a commit whose Check run passed.
  flakes:
    if: always() && github.ref == 'refs/heads/main'
    needs: [test, macos, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flaky-*
          path: ${{ runner.temp }}/flaky
      - run: |
          find "$RUNNER_TEMP/flaky" -name '*.jsonl' -exec cat {} + > "$RUNNER_TEMP/flaky.jsonl" 2> /dev/null || true
          node scripts/file-issue.ts --flakes "$RUNNER_TEMP/flaky.jsonl"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
