name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same checks on Linux and macOS, in parallel, with plain Node.js and pnpm. The host does not support Windows yet.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  # The Nix development shell as developers use it, plus the packed-package and browser checks, and the web
  # app's replaceability checked on its real composition in Chromium (apps/web/AGENTS.md).
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm check
      - run: nix develop -c pnpm test
      - run: nix develop -c pnpm package:check
      - run: nix develop .#browser -c pnpm browser:check
      - run: nix develop .#browser -c pnpm --filter @lemma/web ui:check

  sustained:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEMMA_SEQUENCE_RUNS: "1000"
      LEMMA_SEQUENCE_SEED: ${{ github.run_number }}
      LEMMA_BENCH_OUTPUT_DIR: /tmp/lemma-performance
      # Shared runner timings are advisory; correctness/resource assertions fail.
      LEMMA_PERF_ENFORCE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      # The core's randomized sequences, many more of them; the other packages' tests run in the jobs above.
      - run: nix develop -c pnpm core:test
      - run: nix develop -c pnpm perf:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: /tmp/lemma-performance
          if-no-files-found: warn
