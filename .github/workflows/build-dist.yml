name: Build installable packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:build
      - run: pnpm dist:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lemma-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.tar.gz
            dist/*.sha256

  homebrew:
    name: Homebrew (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lemma-*
          path: dist
          merge-multiple: true
      - name: Install the generated formula from the tested archives
        shell: bash
        run: |
          set -euo pipefail
          node scripts/homebrew.ts
          brew tap lemma/release-test "$GITHUB_WORKSPACE"
          FORMULA_DEST="$(brew --repo lemma/release-test)/Formula/lemma.rb"
          export FORMULA_DEST
          node --input-type=module <<'JS'
          import { readFile, mkdir, writeFile } from "node:fs/promises";
          import { dirname, resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          import { releaseTag, repository } from "./scripts/dist-config.ts";
          const formula = await readFile("dist/lemma.rb", "utf8");
          const local = formula.replaceAll(`https://github.com/${repository}/releases/download/${releaseTag}/`, `${pathToFileURL(resolve("dist")).href}/`);
          await mkdir(dirname(process.env.FORMULA_DEST), { recursive: true });
          await writeFile(process.env.FORMULA_DEST, local);
          JS
          brew style lemma/release-test/lemma
          brew install lemma/release-test/lemma
          brew test lemma/release-test/lemma
