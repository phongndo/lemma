name: Nightly

# Publishes the newest commit on main that passed Check as the next release in its minor version
# (docs/development.md#releases): `v0.2.7` after `v0.2.6`, a GitHub prerelease, which the installer's nightly channel
# installs. Every platform's archive is built on one runner, and the desktop app made from each (macOS's on macOS),
# then installed and run on its own platform (scripts/dist-check.ts, dist-desktop-check.ts), with the installer, npm's
# lemma-harness, and Homebrew's formula, and on macOS its cask (scripts/homebrew.ts), which the release carries for the
# tap. The Promote workflow makes a nightly the stable release. Daily, and by hand; a day with nothing new on main
# publishes nothing. By hand with `publish: false`, it builds and checks the commit it runs on instead, a branch's
# (`gh workflow run nightly.yml --ref <branch> -f publish=false`), and publishes nothing: its files stay the run's
# artifacts for a week.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the newest commit on main that passed Check; when off, build and check this run's commit, and publish nothing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Runs that publish, one at a time; one that does not waits for none.
concurrency:
  group: nightly-${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.run_id || 'publish' }}
  cancel-in-progress: false

# Actions are pinned by commit, their version in the comment.
jobs:
  # The commit, its version, and the release before it; no version when there is nothing new to publish.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          set -euo pipefail
          previous=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ "$PUBLISH" != true ]]; then
            # The commit this run is for (`--ref`), checked whether or not it passed Check, as it is published nowhere.
            sha=$GITHUB_SHA
          else
            # A push's run: a pull request's from a fork's own `main` names that branch too, and its commit is not main's.
            sha=$(gh run list --workflow check.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            [[ -n "$sha" ]] || { echo "::error::No commit on main has passed Check"; exit 1; }
            on_main=$(gh api "repos/$GH_REPO/compare/$sha...main" --jq .status)
            [[ "$on_main" == ahead || "$on_main" == identical ]] || { echo "::error::$sha passed Check but is not on main ($on_main)"; exit 1; }
            if [[ -n "$previous" ]]; then
              # A rerun of an older commit's Check can pass after a newer one's: only a commit after the last release is new.
              status=$(gh api "repos/$GH_REPO/compare/$previous...$sha" --jq .status)
              [[ "$status" == ahead ]] || { echo "::notice::Nothing on main that passed Check is newer than $previous"; exit 0; }
            fi
          fi
          line=$(gh api "repos/$GH_REPO/contents/apps/cli/package.json?ref=$sha" --jq .content | base64 -d | jq -r .version | cut -d. -f1,2)
          [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::apps/cli/package.json has no version line"; exit 1; }
          last=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v$line." --jq '.[].ref' | sed -n "s|^refs/tags/v$line\.\([0-9][0-9]*\)$|\1|p" | sort -n | tail -n 1)
          version="$line.$((${last:--1} + 1))"
          { echo "sha=$sha"; echo "version=$version"; echo "previous=$previous"; } >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" == true ]]; then echo "::notice::Nightly $version from $sha"; else echo "::notice::A trial of $version from $sha, published nowhere"; fi

  # Every target's archive, and the desktop app made from each Linux one, in the development shells as Check builds
  # its own; each target's files an artifact of their own, so a job downloads only those it runs.
  build:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          shell: desktop
      - run: nix develop -c node scripts/dist.ts --version "$VERSION" --target all
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
      - run: nix develop .#desktop -c node scripts/dist-desktop.ts "dist/lemma-v$VERSION-linux-x64.tar.gz" "dist/lemma-v$VERSION-linux-arm64.tar.gz"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
      # Every archive's checksum, which Homebrew's formula names: a job that has its own archive alone makes it too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemma-sums
          path: dist/lemma-v*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemma-darwin-arm64
          path: dist/*-darwin-arm64.*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemma-linux-arm64
          path: dist/*-linux-arm64.*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemma-linux-x64
          path: dist/*-linux-x64.*
          if-no-files-found: error
          retention-days: 7

  # Each Linux archive installed and run on its platform, and its desktop app opened, on plain Node.js (which runs the
  # checks, not Lemma): a user's machine has neither Nix nor the dev shell, and the archive brings its own Node.js.
  verify:
    name: verify (${{ matrix.target }})
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lemma-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lemma-sums
          path: dist
      - run: node scripts/dist-check.ts "dist/lemma-v$VERSION-$TARGET.tar.gz"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
      # What a Linux desktop has that a runner may not: a display, and FUSE, which an AppImage mounts itself with. The
      # Debian package installed as a user installs it, with what it depends on. Both opened as on Ubuntu's desktop,
      # which keeps an app from the user namespaces Electron's sandbox uses unless an AppArmor profile lets it: the
      # package installs one, and the AppImage starts without the sandbox (docs/installation.md#the-desktop-app).
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb fuse3 "./dist/lemma-desktop-v$VERSION-$TARGET.deb"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          xvfb-run -a node scripts/dist-desktop-check.ts --installed "dist/lemma-desktop-v$VERSION-$TARGET.deb"
          xvfb-run -a node scripts/dist-desktop-check.ts "dist/lemma-desktop-v$VERSION-$TARGET.AppImage"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
      # Homebrew's formula for these files where they are, from a tap of its own, as the tap's installs it: its style,
      # its install and test, and that lemma says Homebrew installed it, so lemma update upgrades it with brew.
      - uses: Homebrew/actions/setup-homebrew@dc7099b3e807f1e2ecc61f3ecabc840eedd5586a
      - run: |
          tap=$RUNNER_TEMP/tap
          mkdir -p "$tap/Formula"
          node scripts/homebrew.ts --version "$VERSION" --dist dist --base-url "file://$PWD/dist" --formula "$tap/Formula/lemma.rb"
          git -C "$tap" init --quiet
          git -C "$tap" add Formula
          git -C "$tap" -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m formula
          brew tap lemma/test "$tap"
          brew style lemma/test/lemma
          brew install lemma/test/lemma
          brew test lemma/test/lemma
          "$(brew --prefix)/bin/lemma" version --json | tee "$RUNNER_TEMP/version.json"
          grep -q '"installer": "homebrew"' "$RUNNER_TEMP/version.json"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"

  # macOS's archive, checked as verify checks Linux's; then the desktop app made from it, on macOS as its disk image is,
  # signed ad hoc (scripts/dist-desktop.ts), and opened.
  macos:
    name: verify (darwin-arm64)
    needs: [resolve, build]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lemma-darwin-arm64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lemma-sums
          path: dist
      - run: node scripts/dist-check.ts "dist/lemma-v$VERSION-darwin-arm64.tar.gz"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/dist-desktop.ts "dist/lemma-v$VERSION-darwin-arm64.tar.gz"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
      - run: node scripts/dist-desktop-check.ts "dist/lemma-desktop-v$VERSION-darwin-arm64.dmg"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
      # Homebrew's formula, as on Linux, then its cask: the app in Applications, and the lemma inside it on PATH, which
      # says the cask installed it.
      - uses: Homebrew/actions/setup-homebrew@dc7099b3e807f1e2ecc61f3ecabc840eedd5586a
      - run: |
          tap=$RUNNER_TEMP/tap
          mkdir -p "$tap/Formula" "$tap/Casks"
          node scripts/homebrew.ts --version "$VERSION" --dist dist --base-url "file://$PWD/dist" --formula "$tap/Formula/lemma.rb" --cask "$tap/Casks/lemma.rb"
          git -C "$tap" init --quiet
          git -C "$tap" add Formula Casks
          git -C "$tap" -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m formula
          brew tap lemma/test "$tap"
          brew style lemma/test
          brew install --formula lemma/test/lemma
          brew test lemma/test/lemma
          "$(brew --prefix)/bin/lemma" version --json | tee "$RUNNER_TEMP/version.json"
          grep -q '"installer": "homebrew"' "$RUNNER_TEMP/version.json"
          brew uninstall --formula lemma/test/lemma
          brew install --cask lemma/test/lemma
          test -d /Applications/Lemma.app
          "$(brew --prefix)/bin/lemma" version --json | tee "$RUNNER_TEMP/version.json"
          grep -q '"installer": "homebrew-cask"' "$RUNNER_TEMP/version.json"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemma-desktop-darwin-arm64
          path: dist/lemma-desktop-*
          if-no-files-found: error
          retention-days: 7

  # Each file's build provenance, signed for this workflow (`gh attestation verify`, docs/installation.md); then a
  # draft, published once its files are all there, so the channel never offers a release without them. Then nightlies
  # older than a month that were not promoted go. Not in a run that publishes nothing.
  publish:
    needs: [resolve, verify, macos]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lemma-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Homebrew's formula and cask for the release, from its checksums, which the tap takes up from a stable one.
      - run: node scripts/homebrew.ts --version "$VERSION" --dist dist
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PREVIOUS: ${{ needs.resolve.outputs.previous }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ./*.sha256)
          # A run that failed partway left its draft, which has no tag yet, so this run took the same version.
          gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api --method DELETE "repos/$GH_REPO/releases/$id"; done
          notes=(--generate-notes)
          if [[ -n "$PREVIOUS" ]]; then notes+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" --draft --prerelease --target "$SHA" --title "Lemma $TAG" "${notes[@]}"
          gh release upload "$TAG" dist/*.tar.gz dist/*.dmg dist/*.AppImage dist/*.deb dist/*.sha256 dist/lemma.rb dist/lemma-cask.rb scripts/install.sh
          gh release edit "$TAG" --draft=false

          cutoff=$(date -u -d '30 days ago' +%s)
          gh release list --exclude-drafts --limit 1000 --json tagName,isPrerelease,publishedAt --jq '.[] | select(.isPrerelease) | "\(.tagName) \(.publishedAt)"' |
            while read -r tag published; do
              if [[ "$tag" != "$TAG" ]] && (($(date -u -d "$published" +%s) < cutoff)); then gh release delete "$tag" --cleanup-tag --yes; fi
            done
