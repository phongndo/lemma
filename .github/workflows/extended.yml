name: Extended validation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-validation
  cancel-in-progress: true

jobs:
  platform-tests:
    name: Platform tests (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin
          - os: macos-15-intel
            system: x86_64-darwin
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 500M
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore trusted build cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            third_party/ghostty/.zig-cache
          key: lemma-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            lemma-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules') }}-

      - name: Build and test platform
        run: nix develop --command scripts/ci/platform

      - name: Save trusted build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            third_party/ghostty/.zig-cache
          key: lemma-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}

  benchmark-smoke:
    name: Scheduled benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 500M
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore trusted release cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            third_party/ghostty/.zig-cache
          key: lemma-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            lemma-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules') }}-

      - name: Run release benchmark smoke
        run: nix develop --command scripts/ci/benchmarks smoke

      - name: Upload benchmark reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/benchmark-results.json
            build/release/mux-benchmark-results.json
            build/release/mux-comparison-results.json
            build/release/mux-profile-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Save trusted release cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            third_party/ghostty/.zig-cache
          key: lemma-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}

  foundation-smoke:
    name: F5 foundation evidence smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 500M
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run finite F5 smoke
        run: nix develop --command scripts/ci/f5 smoke

      - name: Upload F5 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f5-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/f5-*
          if-no-files-found: error
          retention-days: 14
