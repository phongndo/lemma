name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      check_run: ${{ steps.release.outputs.check_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned, checked main commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/cli/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)"; then
            [[ "$existing" == "$GITHUB_SHA" ]]
          fi
          checked="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and .event == "push" and .conclusion == "success")][0].id // empty')"
          if [[ -z "$checked" ]]; then
            echo "The Check workflow must pass on this exact main commit before releasing." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "check_run=$checked" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lemma-*
          run-id: ${{ needs.prepare.outputs.check_run }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Verify assets and generate Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4 ]]
          [[ "$(find dist -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4 ]]
          (cd dist && sha256sum --check ./*.sha256)
          node scripts/homebrew.ts
          ruby -c dist/lemma.rb
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            [[ "$(cat release-state)" == true ]] || { echo 'Release is already published; choose a new version.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Lemma $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 dist/lemma.rb scripts/install.sh --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
      - name: Notify Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* ]]; then exit 0; fi
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'The tap will pick up this release on its next scheduled update.'
            exit 0
          fi
          gh api --method POST repos/phongndo/homebrew-tap/dispatches \
            -f event_type=lemma-release -f "client_payload[release_tag]=$RELEASE_TAG"
