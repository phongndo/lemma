name: Bench

# The core's microbenchmarks of a base revision and of this one, alternated on one runner, compared with a
# Mann-Whitney U test (scripts/bench-compare.ts): by hand against any base, or on a pull request labelled
# `performance` against main. Advisory: the table goes to the job summary.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Revision to compare against
        default: origin/main
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c node scripts/bench-compare.ts --base "$BASE" --runs 10 --harness | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BASE: ${{ inputs.base || 'origin/main' }}
          LEMMA_BENCH_OUTPUT_DIR: ${{ runner.temp }}/comparison
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-comparison
          path: ${{ runner.temp }}/comparison
          if-no-files-found: ignore
          retention-days: 90
