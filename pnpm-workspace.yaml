  - "@effect/platform-node-shared@4.0.4"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - dompurify@3.4.17
  - marked@18.1.1
  - vitest@5.0.4
  - zod@4.6.7
